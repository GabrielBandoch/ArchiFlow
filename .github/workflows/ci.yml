name: Frontend CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-test:
    name: Build & Test (Angular 17)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (Production)
        run: npm run build:prod

      - name: Run tests
        run: npm run test:ci

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  deploy:
    name: Deploy to Production
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest

    steps:
      - name: Executar Deploy em Produção
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script_stop: true
          script: |
            echo "=== [1/4] Atualizando código do repositório Frontend ==="
            cd /opt/cotu/ArchiFlow
            git fetch origin main
            git reset --hard origin/main

            echo "=== [2/4] Construindo imagem Docker do Frontend ==="
            cd /opt/cotu/ArchiFlow.API/deploy
            docker compose -f docker-compose.prod.yml build web web-staging

            echo "=== [3/4] Reiniciando containers web e web-staging ==="
            docker compose -f docker-compose.prod.yml up -d --no-deps --force-recreate web web-staging

            echo "=== [4/4] Limpando imagens órfãs ==="
            docker image prune -f

            echo "=== Status dos containers ==="
            docker compose -f docker-compose.prod.yml ps web web-staging
            echo "Deploy do Frontend concluído com sucesso!"
