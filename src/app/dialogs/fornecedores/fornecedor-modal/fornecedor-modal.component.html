<app-dialog
  [show]="show"
  [dialogTitle]="fornecedor ? 'Editar Parceiro Especializado' : 'Novo Parceiro Especializado'"
  size="md"
  [overflowVisible]="true"
  (close)="fechar()">

  <form [formGroup]="form" (ngSubmit)="salvar()" class="d-flex flex-direction-column gap-md fornecedor-form">
    <div class="form-section-header">
      <span class="section-badge-title">Dados do Parceiro</span>
    </div>

    <div class="form-grid-2">
      <div class="field-item">
        <app-input
          id="fornecedorNome"
          type="text"
          label="Nome da Empresa / Parceiro"
          placeholder="Ex: Lumina Iluminação, Joinville Aços"
          formControlName="nome"
          [required]="true"
          [error]="submitted && f['nome'].errors ? 'O nome da empresa ou parceiro é obrigatório.' : undefined">
        </app-input>
      </div>

      <div class="field-item">
        <app-select
          id="fornecedorEspecialidade"
          label="Especialidade Principal"
          [options]="especialidadeOptions"
          formControlName="especialidade"
          placeholder="Selecione a especialidade"
          [required]="true"
          [error]="submitted && f['especialidade'].errors ? 'Selecione uma especialidade.' : undefined">
        </app-select>
      </div>
    </div>

    <div class="form-grid-2">
      <div class="field-item">
        <app-input
          id="fornecedorEmail"
          type="email"
          label="E-mail Comercial"
          placeholder="contato@empresa.com.br"
          formControlName="email"
          [required]="true"
          [error]="submitted && f['email'].errors ? 'E-mail comercial válido é obrigatório.' : undefined">
        </app-input>
      </div>

      <div class="field-item">
        <app-input
          id="fornecedorTelefone"
          type="tel"
          mask="phone"
          label="Telefone / WhatsApp"
          placeholder="(47) 99999-9999"
          formControlName="telefone">
        </app-input>
      </div>
    </div>

    <div class="form-grid-location">
      <div class="field-item">
        <app-input
          id="fornecedorCidade"
          type="text"
          label="Cidade"
          placeholder="Ex: Joinville"
          formControlName="cidade">
        </app-input>
      </div>

      <div class="field-item">
        <app-input
          id="fornecedorEstado"
          type="text"
          label="UF"
          placeholder="SC"
          maxlength="2"
          formControlName="estado">
        </app-input>
      </div>
    </div>

    <div class="field-item">
      <app-input
        id="fornecedorDescricao"
        type="textarea"
        [rows]="3"
        label="Capacidades Técnicas e Descrição"
        placeholder="Ex: Fabricantes especializados em envidraçamento estrutural, caixilharia de alumínio e vidros com isolamento térmico..."
        formControlName="descricao">
      </app-input>
    </div>

    <div class="dialog-actions d-flex justify-content-end align-items-center gap-xs margin-top-md">
      <app-button variant="ghost" type="button" (btnClick)="fechar()" [disabled]="salvando">
        Cancelar
      </app-button>
      <app-button variant="primary" type="submit" [disabled]="salvando">
        <span class="material-symbols-outlined icon-btn-inline" *ngIf="!salvando">
          {{ fornecedor ? 'save' : 'add_business' }}
        </span>
        <span class="material-symbols-outlined icon-btn-inline spinner-icon" *ngIf="salvando">
          progress_activity
        </span>
        {{ salvando ? 'Salvando...' : (fornecedor ? 'Salvar Alterações' : 'Cadastrar Parceiro') }}
      </app-button>
    </div>
  </form>
</app-dialog>
