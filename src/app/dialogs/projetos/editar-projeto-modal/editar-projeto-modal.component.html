<app-dialog [show]="show" dialogTitle="Editar Projeto Arquitetônico" size="md" [overflowVisible]="true" (close)="onClose()">
  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="d-flex flex-direction-column gap-md">
    
    <app-input 
      id="editNome" 
      type="text" 
      label="Nome do Projeto" 
      placeholder="Nome do projeto..."
      formControlName="nome"
      [required]="true"
      [error]="submitted && f['nome'].errors ? 'O nome do projeto é obrigatório.' : undefined">
    </app-input>

    <div class="d-flex gap-md">
      <div class="flex-grow-1">
        <app-select
          id="editTipo"
          label="Tipo de Projeto"
          formControlName="tipo"
          [required]="true"
          [options]="tipoOptions">
        </app-select>
      </div>

      <div class="flex-grow-1">
        <app-select
          id="editStatus"
          label="Status Geral"
          formControlName="status"
          [required]="true"
          [options]="statusOptions">
        </app-select>
      </div>
    </div>

    <div class="d-flex gap-md">
      <div class="flex-grow-1">
        <app-input 
          id="editMetragem" 
          type="number" 
          label="Área Total (m²)" 
          formControlName="metragemTotal">
        </app-input>
      </div>

      <div class="flex-grow-1">
        <app-input 
          id="editDataInicio" 
          type="date" 
          label="Data de Início" 
          formControlName="dataInicio">
        </app-input>
      </div>
    </div>

    <app-input 
      id="editPrevisao" 
      type="date" 
      label="Previsão de Entrega" 
      formControlName="dataPrevistaEntrega">
    </app-input>

    <app-input 
      id="editDescricao" 
      type="text" 
      label="Descrição / Escopo" 
      formControlName="descricao">
    </app-input>

    <div dialog-footer class="d-flex justify-content-end gap-sm">
      <app-button variant="secondary" (btnClick)="onClose()">Cancelar</app-button>
      <app-button type="submit" variant="primary" [disabled]="saving">
        {{ saving ? 'Salvando...' : 'Salvar Alterações' }}
      </app-button>
    </div>
  </form>
</app-dialog>
