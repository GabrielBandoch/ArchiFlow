<button 
  [type]="type" 
  [disabled]="disabled || loading" 
  [title]="title || ''"
  [attr.aria-label]="ariaLabel || null"
  [ngClass]="[
    'btn', 
    'btn-' + variant, 
    'btn-size-' + size, 
    fullWidth ? 'btn-full-width' : '',
    customClass
  ]"
  (click)="onClick($event)">
  <span *ngIf="loading" class="spinner"></span>
  <span *ngIf="!loading" class="btn-content">
    <ng-content></ng-content>
  </span>
</button>
