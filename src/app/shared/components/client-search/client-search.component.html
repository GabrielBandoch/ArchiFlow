<div class="client-search-wrapper">
  <label *ngIf="label" class="client-search-label" [attr.for]="id">
    {{ label }} <span class="text-error" *ngIf="required">*</span>
  </label>

  <div *ngIf="clienteSelecionado" class="selected-client-chip d-flex align-items-center justify-content-between p-sm">
    <div class="d-flex align-items-center gap-sm">
      <div class="chip-avatar">
        <img *ngIf="clienteSelecionado.fotoUrl" [src]="clienteSelecionado.fotoUrl" class="avatar-photo" alt="Avatar" />
        <span *ngIf="!clienteSelecionado.fotoUrl">{{ clienteSelecionado.nome.substring(0, 2).toUpperCase() }}</span>
      </div>
      <div class="d-flex flex-direction-column">
        <span class="font-weight-semibold font-body-md text-on-surface">{{ clienteSelecionado.nome }}</span>
        <span class="font-label-sm text-on-surface-variant">{{ clienteSelecionado.email }}</span>
      </div>
    </div>
    <app-button variant="icon" size="sm" (btnClick)="limparSelecao()" title="Remover seleção" [disabled]="disabled">
      <span class="material-symbols-outlined">close</span>
    </app-button>
  </div>

  <div *ngIf="!clienteSelecionado" class="autocomplete-control-container">
    <div class="search-input-box d-flex align-items-center" [class.has-error]="!!error">
      <span class="material-symbols-outlined icon-prefix">person</span>
      <input 
        [id]="id"
        type="text" 
        class="input-search-native" 
        [placeholder]="placeholder" 
        [(ngModel)]="searchText" 
        (input)="onInputSearch()"
        [disabled]="disabled" />
      
      <button 
        type="button" 
        class="btn-trigger-modal" 
        (click)="abrirModal()" 
        title="Abrir busca avançada de clientes"
        [disabled]="disabled">
        <span class="material-symbols-outlined">search</span>
      </button>
    </div>

    <div *ngIf="showDropdown && sugestoes.length > 0" class="suggestions-dropdown-panel">
      <div 
        *ngFor="let c of sugestoes" 
        class="suggestion-row d-flex align-items-center gap-sm p-sm" 
        (click)="selecionarCliente(c)">
        <div class="suggestion-avatar">
          <img *ngIf="c.fotoUrl" [src]="c.fotoUrl" class="avatar-photo" alt="Avatar" />
          <span *ngIf="!c.fotoUrl">{{ c.nome.substring(0, 2).toUpperCase() }}</span>
        </div>
        <div class="d-flex flex-direction-column">
          <span class="font-weight-medium font-body-md text-on-surface">{{ c.nome }}</span>
          <span class="font-label-sm text-on-surface-variant">{{ c.email }}</span>
        </div>
      </div>
    </div>

    <div *ngIf="showDropdown && sugestoes.length === 0" class="suggestions-dropdown-panel p-sm text-center">
      <span class="font-label-sm text-on-surface-variant">Nenhum cliente encontrado com "{{ searchText }}".</span>
    </div>
  </div>

  <span class="font-label-sm text-error margin-top-xs d-block" *ngIf="error">
    {{ error }}
  </span>
</div>

<app-selecionar-cliente-modal
  [show]="showModal"
  [clientes]="clientes"
  [initialSearchText]="searchText"
  (close)="fecharModal()"
  (clientSelected)="selecionarViaModal($event)">
</app-selecionar-cliente-modal>
