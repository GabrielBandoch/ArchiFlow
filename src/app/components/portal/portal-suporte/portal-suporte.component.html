<section class="support-card">
  <div class="support-header">
    <div class="support-avatar">
      <span class="material-symbols-outlined">architecture</span>
    </div>
    <div>
      <h4>Arquiteto Responsável</h4>
      <p>Escritório de Arquitetura & Interiores</p>
    </div>
  </div>

  <p class="support-text">
    Converse em tempo real sobre plantas, dúvidas, sugestões e alinhamentos deste projeto.
  </p>

  <div class="contact-links">
    <button type="button" class="contact-btn chat-direct" (click)="onAbrirChat()">
      <span class="material-symbols-outlined">forum</span>
      <span>Mensagens com o Arquiteto</span>
    </button>
  </div>
</section>
