<div class="dossier-page" *ngIf="cliente && !loading">
  <nav class="dossier-nav d-flex justify-content-between align-items-center">
    <button type="button" class="nav-back-btn font-label-md" (click)="voltar()">
      <span class="material-symbols-outlined">arrow_back</span>
      <span>Voltar para Clientes</span>
    </button>
    <div class="dossier-badge-wrap d-flex align-items-center gap-xs">
      <span class="dossier-code-chip font-mono"
        >CADASTRO #{{ cliente.id.substring(0, 8) }}</span
      >
    </div>
  </nav>

  <app-cliente-hero-card
    [cliente]="cliente"
    [lead]="lead"
    [projetos]="projetos"
    [totalMetragem]="totalMetragem"
    (avatarSelected)="onAvatarSelected($event)"
    (removePhoto)="removerFoto()"
    (openWhatsApp)="abrirWhatsApp()"
    (openEditModal)="abrirModalEdicao()"
    (togglePortal)="toggleAcessoPortal()"
    (copyText)="copiarTexto($event.text, $event.label)"
  >
  </app-cliente-hero-card>

  <div class="bottom-dual-grid">

    <section class="studio-panel">
      <div
        class="panel-header d-flex align-items-center justify-content-between"
      >
        <div class="title-with-pill d-flex align-items-center gap-xs">
          <span class="material-symbols-outlined panel-header-icon">forum</span>
          <h2 class="panel-heading font-headline-sm m-0">
            Histórico de Interações
          </h2>
          <span class="count-pill font-label-xs">{{ historico.length }}</span>
        </div>
      </div>

      <div class="panel-content">
        <div
          class="timeline-list d-flex flex-direction-column gap-md"
          *ngIf="historico.length > 0; else emptyTimelineTpl"
        >
          <div
            *ngFor="let item of historico"
            class="timeline-item-clean d-flex gap-sm"
          >
            <div
              class="timeline-bullet-col d-flex flex-direction-column align-items-center"
            >
              <div class="bullet-dot"></div>
              <div class="bullet-line flex-grow-1"></div>
            </div>

            <div
              class="timeline-bubble d-flex flex-direction-column gap-xs flex-grow-1 p-sm"
            >
              <div
                class="bubble-header d-flex justify-content-between align-items-center"
              >
                <span class="channel-tag font-label-xs font-weight-bold">{{
                  item.canal
                }}</span>
                <span class="timestamp font-label-xs text-on-surface-variant">{{
                  item.dataContato | date: "dd/MM/yyyy 'às' HH:mm"
                }}</span>
              </div>
              <p class="bubble-text font-body-sm text-on-surface m-0">
                {{ item.resumo }}
              </p>
            </div>
          </div>
        </div>

        <ng-template #emptyTimelineTpl>
          <app-empty-state
            icon="chat_bubble_outline"
            title="Nenhum contato registrado"
            description="Interações e anotações deste cliente registradas no CRM ou Portal aparecerão aqui."
          >
          </app-empty-state>
        </ng-template>
      </div>
    </section>
  </div>
</div>

<div
  *ngIf="loading"
  class="dossier-loading d-flex flex-direction-column align-items-center justify-content-center p-xl"
>
  <span class="material-symbols-outlined spinner-icon mb-sm"
    >progress_activity</span
  >
  <p class="font-body-md font-weight-semibold text-on-surface m-0">
    Carregando ficha e histórico do cliente...
  </p>
</div>
