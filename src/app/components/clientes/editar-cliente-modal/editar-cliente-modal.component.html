<app-dialog [show]="show" dialogTitle="Editar Ficha do Cliente" size="lg" (close)="onClose()">
  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="studio-form d-flex flex-direction-column gap-md">
    <div class="form-section-title">
      <span class="font-label-sm">Identificação Principal</span>
    </div>

    <div class="form-row-2">
      <div class="field-item">
        <label class="field-label font-label-sm">Nome Completo / Razão Social *</label>
        <input 
          type="text" 
          class="field-input font-body-md" 
          placeholder="Nome do cliente" 
          formControlName="nome" />
      </div>

      <div class="field-item">
        <label class="field-label font-label-sm">E-mail Principal *</label>
        <input 
          type="email" 
          class="field-input font-body-md" 
          placeholder="cliente@exemplo.com" 
          formControlName="email" />
      </div>
    </div>

    <div class="tipo-pessoa-pills d-flex align-items-center gap-xs">
      <button 
        type="button" 
        class="pill-btn font-label-md d-inline-flex align-items-center gap-xs" 
        [class.active]="tipoPessoa === 'PF'" 
        (click)="setTipoPessoa('PF')">
        <span class="material-symbols-outlined">person</span>
        Pessoa Física
      </button>
      <button 
        type="button" 
        class="pill-btn font-label-md d-inline-flex align-items-center gap-xs" 
        [class.active]="tipoPessoa === 'PJ'" 
        (click)="setTipoPessoa('PJ')">
        <span class="material-symbols-outlined">domain</span>
        Pessoa Jurídica
      </button>
    </div>

    <div class="form-row-2">
      <div class="field-item">
        <label class="field-label font-label-sm">{{ tipoPessoa === 'PF' ? 'CPF do Titular' : 'CNPJ da Empresa' }}</label>
        <input 
          type="text" 
          class="field-input font-body-md" 
          [placeholder]="tipoPessoa === 'PF' ? '000.000.000-00' : '00.000.000/0001-00'" 
          formControlName="cpfCnpj" 
          (input)="onCpfCnpjInput($event)" />
      </div>

      <div class="field-item">
        <label class="field-label font-label-sm">Telefone de Contato</label>
        <input 
          type="text" 
          class="field-input font-body-md" 
          placeholder="(00) 00000-0000" 
          formControlName="telefone" 
          (input)="onTelefoneInput($event)" />
      </div>
    </div>

    <div class="form-section-title margin-top-md">
      <span class="font-label-sm">Endereço do Imóvel / Obra</span>
    </div>

    <div class="form-row-cep">
      <div class="field-item cep-item">
        <label class="field-label font-label-sm">CEP</label>
        <div class="cep-field-wrap position-relative">
          <input 
            type="text" 
            class="field-input font-body-md" 
            placeholder="00000-000" 
            formControlName="cep" 
            (input)="onCepInput($event)" />
          <div class="cep-spinner position-absolute d-flex align-items-center justify-content-center" *ngIf="buscandoCep">
            <span class="mini-spin"></span>
          </div>
          <div class="cep-success position-absolute d-flex align-items-center justify-content-center" *ngIf="!buscandoCep && form.get('cep')?.value?.length >= 8">
            <span class="material-symbols-outlined">check</span>
          </div>
        </div>
      </div>

      <div class="field-item street-item">
        <label class="field-label font-label-sm">Rua / Logradouro</label>
        <input 
          type="text" 
          class="field-input font-body-md" 
          placeholder="Ex: Av. XV de Novembro" 
          formControlName="logradouro" />
      </div>
    </div>

    <div class="form-row-3">
      <div class="field-item">
        <label class="field-label font-label-sm">Número</label>
        <input 
          type="text" 
          class="field-input font-body-md" 
          placeholder="123" 
          formControlName="numero" />
      </div>

      <div class="field-item">
        <label class="field-label font-label-sm">Complemento</label>
        <input 
          type="text" 
          class="field-input font-body-md" 
          placeholder="Apto, Sala, Bloco..." 
          formControlName="complemento" />
      </div>

      <div class="field-item">
        <label class="field-label font-label-sm">Bairro</label>
        <input 
          type="text" 
          class="field-input font-body-md" 
          placeholder="Bairro" 
          formControlName="bairro" />
      </div>
    </div>

    <div class="form-row-2">
      <div class="field-item">
        <label class="field-label font-label-sm">Cidade</label>
        <input 
          type="text" 
          class="field-input font-body-md" 
          placeholder="Cidade" 
          formControlName="cidade" />
      </div>

      <div class="field-item">
        <label class="field-label font-label-sm">Estado (UF)</label>
        <input 
          type="text" 
          class="field-input font-body-md" 
          placeholder="UF" 
          maxlength="2"
          formControlName="uf" />
      </div>
    </div>

    <div dialog-footer class="studio-modal-actions d-flex align-items-center justify-content-end gap-sm margin-top-md">
      <app-button variant="secondary" (btnClick)="onClose()">Cancelar</app-button>
      <app-button type="submit" variant="primary">
        Salvar Alterações
      </app-button>
    </div>
  </form>
</app-dialog>
