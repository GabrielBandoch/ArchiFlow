<div class="empresa-container p-xl">
  <div class="header-section margin-bottom-xl">
    <div class="d-flex align-items-center gap-sm">
      <a
        routerLink="/configuracoes"
        class="back-link"
        aria-label="Voltar para configurações"
        title="Voltar para configurações"
      >
        <span class="material-symbols-outlined">arrow_back</span>
      </a>
      <div>
        <h1 class="page-title">Dados da Empresa & Marca</h1>
        <p class="page-subtitle text-secondary">
          Centralize a identidade visual, dados cadastrais e registro
          profissional do escritório.
        </p>
      </div>
    </div>
  </div>

  @if (carregando) {
    <div class="loading-state d-flex justify-content-center p-xxl">
      <app-spinner size="lg"></app-spinner>
    </div>
  } @else {
    <div class="empresa-grid">
      <div class="left-col d-flex flex-direction-column gap-xl">
        <app-empresa-logo-card
          [logoUrl]="empresa?.logoUrl"
          [enviandoLogo]="enviandoLogo"
          (logoSelecionado)="onLogoSelecionado($event)"
          (removerLogo)="removerLogo()"
        >
        </app-empresa-logo-card>

        <app-empresa-identidade-card
          [corPrimaria]="empresaForm.get('corPrimaria')?.value"
          [paletaCores]="paletaCores"
          [salvandoCor]="salvandoCor"
          (corPrimariaChange)="onCorPrimariaChange($event)"
          (selecionarCorPredefinida)="selecionarCorPredefinida($event)"
          (salvarIdentidadeVisual)="salvarIdentidadeVisual()"
        >
        </app-empresa-identidade-card>
        
      </div>

      <div class="right-col">
        <app-empresa-dados-form
          [formGroup]="empresaForm"
          [salvando]="salvando"
          [buscandoCep]="buscandoCep"
          (salvar)="salvar()"
          (cnpjInput)="onCnpjInput($event)"
          (telefoneInput)="onTelefoneInput($event)"
          (cepInput)="onCepInput($event)"
          (cepChange)="onCepChange($event)"
        >
        </app-empresa-dados-form>
      </div>
    </div>
  }
</div>
