<app-card>
  <div class="p-lg">
    <div class="card-title-row margin-bottom-lg">
      <h3 class="card-title">Informações Cadastrais</h3>
      <p class="card-subtitle text-secondary font-body-sm">
        Dados institucionais e regulatórios do escritório de arquitetura.
      </p>
    </div>

    <form
      [formGroup]="formGroup"
      (ngSubmit)="salvar.emit()"
      class="d-flex flex-direction-column gap-lg"
    >
      <div class="form-section">
        <h4 class="section-title font-label-md margin-bottom-sm">
          Identificação do Escritório
        </h4>
        <div class="d-flex flex-direction-column gap-md">
          <div class="form-row d-flex gap-md flex-wrap">
            <div class="flex-1">
              <app-input
                id="nomeEmpresa"
                type="text"
                label="Nome Fantasia / Nome do Escritório *"
                placeholder="Ex: Studio ArchiFlow Arquitetura"
                icon="apartment"
                formControlName="nomeEmpresa"
                [error]="
                  f['nomeEmpresa'].errors && f['nomeEmpresa'].touched
                    ? 'Nome do escritório é obrigatório.'
                    : undefined
                "
              >
              </app-input>
            </div>

            <div class="flex-1">
              <app-input
                id="razaoSocial"
                type="text"
                label="Razão Social"
                placeholder="Ex: Studio ArchiFlow LTDA"
                icon="domain"
                formControlName="razaoSocial"
              >
              </app-input>
            </div>
          </div>

          <div class="form-row d-flex gap-md flex-wrap">
            <div class="flex-1">
              <app-input
                id="cnpj"
                type="text"
                label="CNPJ / CPF"
                placeholder="00.000.000/0000-00"
                icon="pin"
                mask="cpf-cnpj"
                formControlName="cnpj"
                (input)="cnpjInput.emit($event)"
                [error]="
                  f['cnpj'].errors && f['cnpj'].touched
                    ? 'CPF ou CNPJ inválido.'
                    : undefined
                "
              >
              </app-input>
            </div>

            <div class="flex-1">
              <app-input
                id="registroProfissional"
                type="text"
                label="Registro Profissional (CAU / CREA)"
                placeholder="Ex: CAU/SP A12345-6"
                icon="verified"
                formControlName="registroProfissional"
              >
              </app-input>
            </div>
          </div>

          <app-input
            id="slogan"
            type="text"
            label="Slogan / Assinatura Institucional"
            placeholder="Ex: Arquitetura autoral, funcional e sustentável"
            icon="format_quote"
            formControlName="slogan"
          >
          </app-input>
        </div>
      </div>

      <div class="form-section border-top pt-md">
        <h4 class="section-title font-label-md margin-bottom-sm">
          Canais de Contato
        </h4>
        <div class="d-flex flex-direction-column gap-md">
          <div class="form-row d-flex gap-md flex-wrap">
            <div class="flex-1">
              <app-input
                id="email"
                type="email"
                label="E-mail Comercial"
                placeholder="contato@estudio.com.br"
                icon="mail"
                formControlName="email"
                [error]="
                  f['email'].errors && f['email'].touched
                    ? 'Formato de e-mail inválido.'
                    : undefined
                "
              >
              </app-input>
            </div>

            <div class="flex-1">
              <app-input
                id="telefone"
                type="tel"
                label="Telefone / WhatsApp Comercial"
                placeholder="(00) 00000-0000"
                icon="call"
                mask="phone"
                formControlName="telefone"
                (input)="telefoneInput.emit($event)"
              >
              </app-input>
            </div>
          </div>

          <app-input
            id="website"
            type="text"
            label="Website Institucional"
            placeholder="https://www.estudio.com.br"
            icon="language"
            formControlName="website"
            [error]="
              f['website'].errors && f['website'].touched
                ? 'Endereço de website inválido (ex: https://empresa.com.br).'
                : undefined
            "
          >
          </app-input>
        </div>
      </div>

      <div class="form-section border-top pt-md">
        <h4 class="section-title font-label-md margin-bottom-sm">
          Endereço Comercial
        </h4>
        <div class="d-flex flex-direction-column gap-md">
          <div class="form-row d-flex gap-md flex-wrap">
            <div class="flex-2">
              <app-input
                id="endereco"
                type="text"
                label="Logradouro e Número"
                placeholder="Av. Paulista, 1000 - Conjunto 101"
                icon="location_on"
                formControlName="endereco"
                [error]="
                  f['endereco'].errors?.['minlength'] && f['endereco'].touched
                    ? 'Mínimo de 3 caracteres.'
                    : undefined
                "
              >
              </app-input>
            </div>

            <div class="flex-1">
              <app-input
                id="cep"
                type="text"
                label="CEP"
                placeholder="00000-000"
                icon="markunread_mailbox"
                mask="cep"
                formControlName="cep"
                (input)="cepInput.emit($event)"
                (valueChange)="cepChange.emit($event)"
              >
              </app-input>
              <span
                *ngIf="buscandoCep"
                class="font-label-xs text-primary d-block margin-top-xs"
              >
                <span class="mini-spin d-inline-block"></span>
                Consultando ViaCEP...
              </span>
            </div>
          </div>

          <div class="form-row d-flex gap-md flex-wrap">
            <div class="flex-2">
              <app-input
                id="cidade"
                type="text"
                label="Cidade"
                placeholder="São Paulo"
                icon="map"
                formControlName="cidade"
                [error]="
                  f['cidade'].errors?.['minlength'] && f['cidade'].touched
                    ? 'Mínimo de 2 caracteres.'
                    : undefined
                "
              >
              </app-input>
            </div>

            <div class="flex-1">
              <app-input
                id="estado"
                type="text"
                label="Estado (UF)"
                placeholder="SP"
                icon="flag"
                formControlName="estado"
                [error]="
                  f['estado'].errors?.['minlength'] && f['estado'].touched
                    ? 'Mínimo de 2 caracteres.'
                    : undefined
                "
              >
              </app-input>
            </div>
          </div>
        </div>
      </div>

      <div class="d-flex justify-content-end margin-top-md">
        <app-button type="submit" [loading]="salvando">
          Salvar Dados da Empresa
          <span class="material-symbols-outlined icon">save</span>
        </app-button>
      </div>
    </form>
  </div>
</app-card>
