<app-card>
  <div class="p-lg">
    <div
      class="d-flex justify-content-between align-items-center margin-bottom-xs"
    >
      <h3 class="card-title m-0">Identidade Visual</h3>
    </div>
    <p class="card-subtitle text-secondary font-body-sm margin-bottom-md">
      Cor primária aplicada a relatórios, cabeçalhos, propostas comerciais e
      destaques do sistema.
    </p>

    <div class="swatches-container d-flex gap-xs margin-bottom-md flex-wrap">
      <button
        *ngFor="let cor of paletaCores"
        type="button"
        class="swatch-btn"
        [style.background-color]="cor"
        [class.active]="corPrimaria === cor"
        [title]="cor"
        [attr.aria-label]="'Selecionar cor ' + cor"
        (click)="selecionarCor(cor)"
      >
        <span
          class="material-symbols-outlined check-icon"
          *ngIf="corPrimaria === cor"
          >check</span
        >
      </button>
    </div>

    <div
      class="color-picker-row d-flex align-items-center gap-md margin-bottom-md"
    >
      <input
        type="color"
        class="color-input"
        aria-label="Selecionar cor primária"
        [value]="corPrimaria || '#765538'"
        (input)="onColorPickerInput($event)"
      />

      <div class="flex-1">
        <app-input
          id="corPrimariaInput"
          type="text"
          label="Código Hexadecimal"
          icon="palette"
          [ngModel]="corPrimaria"
          (ngModelChange)="onHexChange($event)"
          placeholder="#765538"
          maxlength="7"
        >
        </app-input>
      </div>
    </div>

    <div class="d-flex justify-content-end">
      <app-button
        type="button"
        variant="secondary"
        (btnClick)="salvarIdentidadeVisual.emit()"
        [loading]="salvandoCor"
      >
        Salvar Identidade Visual
        <span class="material-symbols-outlined icon">palette</span>
      </app-button>
    </div>
  </div>
</app-card>
