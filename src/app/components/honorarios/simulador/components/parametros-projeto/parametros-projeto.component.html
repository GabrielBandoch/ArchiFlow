<div class="card param-card shadow-sm">
  <div class="card-header-clean d-flex justify-content-between align-items-center">
    <div class="d-flex align-items-center gap-xs">
      <span class="material-symbols-outlined section-icon" aria-hidden="true">analytics</span>
      <h2 class="section-title">Parâmetros do Projeto</h2>
    </div>
  </div>

  <form [formGroup]="form" class="param-form d-flex flex-direction-column gap-md">
    
    <!-- SEÇÃO: VÍNCULO DO CLIENTE OU LEAD -->
    <div class="cliente-vinculo-section">
      <div class="d-flex justify-content-between align-items-center mb-xs">
        <label class="form-label font-label-sm m-0">Cliente / Lead da Proposta</label>
        <span class="badge-vinculo-status font-label-xs" [class.badge-ok]="form.value.tipoVinculo && form.value.tipoVinculo !== 'nenhum'">
          {{ form.value.tipoVinculo === 'nenhum' || !form.value.tipoVinculo ? 'Opcional (Rascunho)' : 'Vinculado' }}
        </span>
      </div>

      <div class="tipo-vinculo-pills d-flex gap-xs mb-sm">
        <button
          type="button"
          class="pill-btn"
          [class.active]="form.value.tipoVinculo === 'nenhum' || !form.value.tipoVinculo"
          (click)="setTipoVinculo('nenhum')">
          <span class="material-symbols-outlined icon-sm">draft</span>
          Rascunho
        </button>
        <button
          type="button"
          class="pill-btn"
          [class.active]="form.value.tipoVinculo === 'lead'"
          (click)="setTipoVinculo('lead')">
          <span class="material-symbols-outlined icon-sm">person_search</span>
          Lead
        </button>
        <button
          type="button"
          class="pill-btn"
          [class.active]="form.value.tipoVinculo === 'cliente'"
          (click)="setTipoVinculo('cliente')">
          <span class="material-symbols-outlined icon-sm">group</span>
          Cliente
        </button>
        <button
          type="button"
          class="pill-btn"
          [class.active]="form.value.tipoVinculo === 'avulso'"
          (click)="setTipoVinculo('avulso')">
          <span class="material-symbols-outlined icon-sm">edit_note</span>
          Avulso
        </button>
      </div>

      <!-- SE FOR LEAD -->
      <div class="vinculo-selector animate-fade-in" *ngIf="form.value.tipoVinculo === 'lead'">
        <select formControlName="leadId" class="form-control select-custom" (change)="onLeadChange($event)">
          <option value="">Selecione um lead da lista...</option>
          <option *ngFor="let lead of leads" [value]="lead.id">
            {{ lead.nome }} {{ lead.telefone ? '• ' + lead.telefone : '' }}
          </option>
        </select>
      </div>

      <!-- SE FOR CLIENTE -->
      <div class="vinculo-selector animate-fade-in" *ngIf="form.value.tipoVinculo === 'cliente'">
        <select formControlName="clienteId" class="form-control select-custom" (change)="onClienteChange($event)">
          <option value="">Selecione um cliente cadastrado...</option>
          <option *ngFor="let cli of clientes" [value]="cli.id">
            {{ cli.nome }} {{ cli.telefone ? '• ' + cli.telefone : '' }}
          </option>
        </select>
      </div>

      <!-- SE FOR CONTATO AVULSO -->
      <div class="vinculo-avulso-grid animate-fade-in d-flex flex-direction-column gap-xs" *ngIf="form.value.tipoVinculo === 'avulso'">
        <input type="text" formControlName="clienteNome" class="form-control" placeholder="Nome completo do cliente *">
        <div class="d-flex gap-xs flex-wrap">
          <input type="text" formControlName="clienteTelefone" class="form-control flex-grow-1" placeholder="WhatsApp / Telefone (ex: 47999999999)">
          <input type="email" formControlName="clienteEmail" class="form-control flex-grow-1" placeholder="E-mail de contato">
        </div>
      </div>

      <!-- RESUMO DO CLIENTE SELECIONADO -->
      <div class="cliente-selecionado-card mt-xs p-xs d-flex align-items-center justify-content-between" *ngIf="clienteSelecionadoInfo">
        <div class="d-flex align-items-center gap-xs font-body-xs">
          <span class="material-symbols-outlined icon-sm text-primary">check_circle</span>
          <span><strong>{{ clienteSelecionadoInfo.nome }}</strong> {{ clienteSelecionadoInfo.detalhes }}</span>
        </div>
      </div>
    </div>

    <!-- ÁREA ESTIMADA & TIPO DE PROJETO -->
    <div class="form-row-2">
      <div class="form-group">
        <label for="metragemInput" class="form-label">Área Estimada (m²)</label>
        <div class="input-with-suffix">
          <input
            id="metragemInput"
            type="number"
            formControlName="metragemQuadrada"
            class="form-control input-metragem"
            min="1"
            step="1"
            placeholder="150"
            aria-label="Área estimada em metros quadrados"
          />
          <span class="suffix-badge" aria-hidden="true">m²</span>
        </div>
      </div>

      <div class="form-group">
        <label for="tipoProjetoSelect" class="form-label">Tipo de Projeto</label>
        <select
          id="tipoProjetoSelect"
          formControlName="tipoProjeto"
          class="form-control select-custom"
          aria-label="Tipo de projeto"
        >
          <option *ngFor="let tipo of tiposProjeto" [value]="tipo.valor">
            {{ tipo.nome }}
          </option>
        </select>
      </div>
    </div>

    <!-- PADRÃO DO IMÓVEL -->
    <div class="form-group mt-xs">
      <label class="form-label">Padrão do Imóvel</label>
      <div class="padroes-grid" role="radiogroup" aria-label="Padrão do Imóvel">
        <button
          type="button"
          *ngFor="let p of padroesImovel"
          class="padrao-card"
          [class.selected]="form.value.padraoImovel === p.valor"
          (click)="onSelectPadrao(p.valor)"
          [attr.aria-checked]="form.value.padraoImovel === p.valor"
          role="radio"
        >
          <span class="padrao-nome">{{ p.nome }}</span>
          <span class="padrao-fator">{{ p.fator }}</span>
        </button>
      </div>
    </div>
  </form>
</div>
