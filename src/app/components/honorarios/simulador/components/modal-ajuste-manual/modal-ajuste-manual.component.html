<app-dialog [show]="show" dialogTitle="Ajuste Manual do Valor" size="sm" (close)="close.emit()">
  <form [formGroup]="form" (ngSubmit)="confirmar.emit()" class="d-flex flex-direction-column gap-md">
    <div class="field-item">
      <label class="field-label font-label-sm" for="inputAjuste">Novo Valor Sugerido (R$) *</label>
      <input
        id="inputAjuste"
        type="number"
        formControlName="valorAjustado"
        class="field-input font-body-md font-weight-bold"
        min="1"
        step="0.01"
      />
    </div>

    <div class="field-item">
      <label class="field-label font-label-sm" for="inputMotivo">Motivo do Ajuste</label>
      <input
        id="inputMotivo"
        type="text"
        formControlName="motivo"
        class="field-input font-body-md"
        placeholder="Ex: Desconto de lançamento ou complexidade especial"
      />
    </div>

    <div dialog-footer class="studio-modal-actions d-flex align-items-center justify-content-end gap-sm margin-top-md">
      <app-button variant="secondary" (btnClick)="close.emit()">Cancelar</app-button>
      <app-button type="submit" variant="primary" [disabled]="form.invalid">Aplicar</app-button>
    </div>
  </form>
</app-dialog>
