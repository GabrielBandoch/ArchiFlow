<div class="detalhes-page d-flex flex-direction-column gap-lg" *ngIf="projeto">
  <nav class="breadcrumb-bar d-flex align-items-center gap-xs font-label-md">
    <a routerLink="/projetos" class="breadcrumb-link d-flex align-items-center gap-xs">
      <span class="material-symbols-outlined icon-home">arrow_back</span>
      <span>Projetos</span>
    </a>
    <span class="breadcrumb-separator">/</span>
    <span class="breadcrumb-current">{{ projeto.nome }}</span>
  </nav>

  <app-projeto-hero-card
    [projeto]="projeto"
    [statusProjetoOptions]="statusProjetoOptions"
    (statusAlterado)="alterarStatusProjeto($event)"
    (editarSolicitado)="abrirModalEdicao()">
  </app-projeto-hero-card>

  <div class="dossier-nav-tabs d-flex align-items-center gap-lg">
    <button 
      type="button" 
      class="nav-tab-btn font-label-md" 
      [class.active]="activeTab === 'etapas'" 
      (click)="setTab('etapas')">
      Etapas do Projeto ({{ projeto.etapas.length }})
    </button>
    <button 
      type="button" 
      class="nav-tab-btn font-label-md" 
      [class.active]="activeTab === 'arquivos'" 
      (click)="setTab('arquivos')">
      Arquivos & Pranchas ({{ arquivos.length }})
    </button>
    <button 
      type="button" 
      class="nav-tab-btn font-label-md" 
      [class.active]="activeTab === 'fornecedores'" 
      (click)="setTab('fornecedores')">
      Parceiros & Especialistas ({{ fornecedoresProjeto.length }})
    </button>
  </div>

  <div class="dossier-bento-grid">
    <div class="bento-main-col d-flex flex-direction-column gap-md">
      <app-projeto-etapas
        *ngIf="activeTab === 'etapas'"
        [etapas]="projeto.etapas"
        [progressoPercentual]="projeto.progressoPercentual"
        [etapaAtiva]="etapaAtiva"
        (novaEtapaSolicitada)="abrirModalNovaEtapa()"
        (etapaStatusAlterado)="onEtapaStatusAlterado($event)"
        (tarefaToggled)="onTarefaToggled($event)"
        (tarefaAdicionada)="onTarefaAdicionada($event)"
        (tarefaRemovida)="onTarefaRemovida($event)">
      </app-projeto-etapas>

      <app-projeto-arquivos
        *ngIf="activeTab === 'arquivos'"
        [arquivos]="arquivos"
        [uploadingArquivo]="uploadingArquivo"
        (arquivoUpload)="onArquivoUpload($event)"
        (arquivoExcluido)="excluirArquivo($event)">
      </app-projeto-arquivos>

      <app-projeto-fornecedores
        *ngIf="activeTab === 'fornecedores'"
        [projetoId]="projeto.id"
        [projetoNome]="projeto.nome"
        [fornecedoresVinculados]="fornecedoresProjeto"
        (vinculoAlterado)="carregarFornecedoresDoProjeto()">
      </app-projeto-fornecedores>
    </div>

    <app-projeto-sidebar
      [projeto]="projeto"
      [arquivos]="arquivos"
      [totalConcluidas]="totalConcluidas"
      (verTodosArquivos)="setTab('arquivos')">
    </app-projeto-sidebar>
  </div>

  <app-chat-widget 
    *ngIf="projeto" 
    [projetoId]="projeto.id" 
    [projetoNome]="projeto.nome" 
    [interlocutorNome]="projeto.clienteNome || 'Cliente'"
    [interlocutorCargo]="'Cliente do Projeto'"
    [floating]="true">
  </app-chat-widget>
</div>
