<div class="table-card d-flex flex-direction-column">
  <app-dashboard-widget-header
    title="Propostas de Honorários"
    subtitle="Últimas propostas comerciais emitidas"
    icon="request_quote"
    iconVariant="green"
    actionText="Simular Nova"
    actionLink="/simulador">
  </app-dashboard-widget-header>

  <div *ngIf="propostas.length === 0" class="empty-state d-flex flex-direction-column align-items-center justify-content-center p-xl">
    <div class="empty-icon-circle d-flex align-items-center justify-content-center">
      <span class="material-symbols-outlined">receipt_long</span>
    </div>
    <p class="empty-title font-label-md font-weight-bold m-0 margin-top-sm">Nenhuma proposta recente</p>
    <span class="font-label-sm text-outline margin-top-xs">Utilize o simulador para calcular novos honorários.</span>
  </div>

  <div *ngIf="propostas.length > 0" class="compact-list d-flex flex-direction-column gap-sm">
    <div *ngFor="let prop of propostas" class="compact-item d-flex align-items-center justify-content-between">
      <div class="d-flex flex-direction-column min-w-0 flex-grow-1">
        <div class="d-flex align-items-center gap-xs">
          <span class="badge-code font-label-sm">{{ prop.codigo }}</span>
          <span class="font-label-md font-weight-bold text-on-surface truncate">{{ prop.titulo }}</span>
        </div>
        <span class="font-label-sm text-outline truncate margin-top-2xs">{{ prop.clienteOuLeadNome || 'Sem destinatário' }} • {{ prop.metragemQuadrada }} m²</span>
      </div>
      <div class="d-flex flex-direction-column align-items-end gap-2xs flex-shrink-0">
        <span class="prop-valor font-label-md font-weight-bold text-on-surface">{{ formatarMoeda(prop.valorFinal) }}</span>
        <span class="status-badge-sm font-label-sm" [ngClass]="obterBadgeStatus(prop.status)">{{ prop.status }}</span>
      </div>
    </div>
  </div>
</div>
