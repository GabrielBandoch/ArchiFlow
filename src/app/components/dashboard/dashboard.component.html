<div class="d-flex flex-direction-column gap-lg w-full">
  <header class="dashboard-header d-flex align-items-center justify-content-between flex-wrap gap-md">
    <div class="d-flex flex-direction-column gap-xs">
      <div class="header-tag d-inline-flex align-items-center gap-xs">
        <span class="material-symbols-outlined">space_dashboard</span>
        <span>Visão Geral do Escritório</span>
      </div>
      <h1 class="font-headline-lg m-0 text-on-surface">Dashboard</h1>
      <p class="font-body-md text-on-surface-variant m-0 header-subtitle">
        Acompanhamento consolidado de projetos, funil de vendas, honorários e métricas em tempo real.
      </p>
    </div>

    <div class="d-flex align-items-center gap-sm flex-wrap">
      <app-button variant="outline" size="md" (btnClick)="abrirModalPersonalizar()">
        <span class="material-symbols-outlined">tune</span>
        Personalizar Painel
      </app-button>

      <a routerLink="/simulador">
        <app-button variant="primary" size="md">
          <span class="material-symbols-outlined">calculate</span>
          Simulador
        </app-button>
      </a>

      <app-button variant="outline" size="md" [disabled]="loading" (btnClick)="carregarDados()" title="Atualizar dados">
        <span class="material-symbols-outlined" [class.spinning]="loading">refresh</span>
      </app-button>
    </div>
  </header>

  <div *ngIf="loading" class="d-flex align-items-center justify-content-center gap-md padding-xl text-on-surface-variant">
    <div class="spinner"></div>
    <span class="font-body-md">Carregando métricas consolidadas...</span>
  </div>

  <div *ngIf="!loading && metricas" class="dashboard-grid">
    <ng-container *ngFor="let widget of widgetsOrdenados">
      
      <div *ngIf="widget.id === 'kpi_resumo' && widget.visivel" class="widget-wrapper col-full">
        <app-dashboard-kpis [kpis]="metricas.kpis"></app-dashboard-kpis>
      </div>

      <div *ngIf="widget.id === 'atalhos_rapidos' && widget.visivel" class="widget-wrapper col-full">
        <app-dashboard-acoes-rapidas (novoProjeto)="abrirModalCriarProjeto()" (novoLead)="abrirModalCriarLead()"></app-dashboard-acoes-rapidas>
      </div>

      <div *ngIf="widget.id === 'grafico_projetos_status' && widget.visivel" class="widget-wrapper col-half">
        <app-projetos-status-chart
          [dados]="metricas.projetosPorStatus"
          [totalProjetos]="metricas.kpis.totalProjetosAtivos + metricas.kpis.totalProjetosConcluidos">
        </app-projetos-status-chart>
      </div>

      <div *ngIf="widget.id === 'grafico_projetos_tipo' && widget.visivel" class="widget-wrapper col-half">
        <app-projetos-tipo-chart [dados]="metricas.projetosPorTipo"></app-projetos-tipo-chart>
      </div>

      <div *ngIf="widget.id === 'grafico_funil_leads' && widget.visivel" class="widget-wrapper col-half">
        <app-leads-funil-chart [dados]="metricas.leadsPorStatus"></app-leads-funil-chart>
      </div>

      <div *ngIf="widget.id === 'grafico_origens_lead' && widget.visivel" class="widget-wrapper col-half">
        <app-leads-origem-chart [dados]="metricas.leadsPorOrigem"></app-leads-origem-chart>
      </div>

      <div *ngIf="widget.id === 'grafico_propostas_mensal' && widget.visivel" class="widget-wrapper col-full">
        <app-propostas-mensais-chart [dados]="metricas.propostasMensais" [pipelineTotal]="metricas.kpis.valorTotalPropostas"></app-propostas-mensais-chart>
      </div>

      <div *ngIf="widget.id === 'tabela_projetos_recentes' && widget.visivel" class="widget-wrapper col-full">
        <app-projetos-recentes [projetos]="metricas.projetosRecentes"></app-projetos-recentes>
      </div>

      <div *ngIf="widget.id === 'lista_leads_recentes' && widget.visivel" class="widget-wrapper col-half">
        <app-leads-recentes [leads]="metricas.leadsRecentes"></app-leads-recentes>
      </div>

      <div *ngIf="widget.id === 'lista_propostas_recentes' && widget.visivel" class="widget-wrapper col-half">
        <app-propostas-recentes [propostas]="metricas.propostasRecentes"></app-propostas-recentes>
      </div>

    </ng-container>
  </div>
</div>
