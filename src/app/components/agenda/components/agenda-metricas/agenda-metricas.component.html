<div class="metrics-grid">
  <div class="metric-card">
    <div class="metric-icon-wrap bg-primary-soft text-primary">
      <span class="material-symbols-outlined">event</span>
    </div>
    <div class="metric-content">
      <span class="metric-label font-label-sm">Total no Mês</span>
      <span class="metric-value font-headline-sm">{{
        totalCompromissosMes
      }}</span>
    </div>
  </div>

  <div class="metric-card">
    <div class="metric-icon-wrap bg-info-soft text-info">
      <span class="material-symbols-outlined">groups</span>
    </div>
    <div class="metric-content">
      <span class="metric-label font-label-sm">Reuniões</span>
      <span class="metric-value font-headline-sm">{{ totalReunioes }}</span>
    </div>
  </div>

  <div class="metric-card">
    <div class="metric-icon-wrap bg-warning-soft text-warning">
      <span class="material-symbols-outlined">construction</span>
    </div>
    <div class="metric-content">
      <span class="metric-label font-label-sm">Visitas a Obras</span>
      <span class="metric-value font-headline-sm">{{
        totalVisitasObras
      }}</span>
    </div>
  </div>

  <div class="metric-card">
    <div class="metric-icon-wrap bg-success-soft text-success">
      <span class="material-symbols-outlined">check_circle</span>
    </div>
    <div class="metric-content">
      <span class="metric-label font-label-sm">Concluídos</span>
      <span class="metric-value font-headline-sm">{{ totalConcluidos }}</span>
    </div>
  </div>
</div>
